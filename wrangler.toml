name = "crypto-market-bot"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[observability]
enabled = true

# كرون واحد كل دقيقة (نفس طريقة النسخة القديمة الشغالة). الكود يقرر شنو ينشر ومتى.
[triggers]
crons = ["* * * * *"]

# الإعدادات تُحفظ بـ KV (نفس الـ namespace القديم، نقرأ إعداداتك القديمة منه تلقائياً)
[[kv_namespaces]]
binding = "CONFIG"
id = "05ddbf5016944b54a8b2b0fe862c1d0b"
